name = "meson-yourls-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# Secrets are NOT defined here — they are set via dashboard or wrangler CLI:
#
#   wrangler secret put YOURLS_TOKEN_J
#   wrangler secret put YOURLS_TOKEN_G
#   wrangler secret put YOURLS_TOKEN_L
#   wrangler secret put ALLOWED_ORIGIN
#
# This file is safe to commit. Secrets never appear in any file.

[observability]
enabled = true
